[package]
name = "fshot"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyrender = { workspace = true }
anyrender_skia = { workspace = true }
anyrender_vello = { workspace = true }
anyrender_vello_cpu = { workspace = true, features = ["multithreading"] }
anyrender_vello_hybrid = { workspace = true }
blitz-dom = { workspace = true, features = ["default", "floats"] }
blitz-html = { workspace = true }
blitz-traits = { workspace = true }
blitz-paint = { workspace = true, features = ["svg"] }
blitz-net = { workspace = true }
style = { workspace = true }
style_traits = { workspace = true }
peniko = { workspace = true }
pollster = { workspace = true }
png = { workspace = true }
image = { workspace = true, features = ["png", "jpeg"] }
skia-safe = "0.157.0"
serde_json = "1"
libc = "0.2"
url = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
vello_gpu = "0.4"
wgpu = { workspace = true }
wgpu_context = { workspace = true }
