[package]
name = "fshot"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyrender = { workspace = true }
anyrender_vello_cpu = { workspace = true, features = ["multithreading"] }
anyrender_vello = { workspace = true }
blitz-dom = { workspace = true, features = ["default", "floats"] }
blitz-html = { workspace = true }
blitz-traits = { workspace = true }
blitz-paint = { workspace = true, features = ["svg"] }
blitz-net = { workspace = true }
peniko = { workspace = true }
png = { workspace = true }
image = { workspace = true, features = ["png", "jpeg"] }
url = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
