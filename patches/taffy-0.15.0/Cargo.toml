# known-future (wave 2): taffy 0.15.0 at DioxusLabs/taffy a3997d55bacd1fb6cd12fe31db0be15b20f91528 (the revision the
# workspace pinned), vendored so it can be patched: a preferred aspect ratio is applied to the box that
# `box-sizing` names (src/geometry.rs, maybe_apply_aspect_ratio_to_border_box). Cargo.toml.orig is upstream's
# manifest; this one drops its dev-dependencies, benches, examples and nested workspace.
[package]
name = "taffy"
version = "0.15.0"
authors = [
    "Alice Cecile <alice.i.cecile@gmail.com>",
    "Johnathan Kelley <jkelleyrtp@gmail.com>",
    "Nico Burns <nico@nicoburns.com>",
]
edition = "2021"
rust-version = "1.85"
description = "A flexible UI layout library "
repository = "https://github.com/DioxusLabs/taffy"
keywords = ["cross-platform", "layout", "flexbox", "css-grid", "grid"]
categories = ["gui"]
license = "MIT"

[dependencies]
document-features = { version = "0.2.7", optional = true }
serde = { version = "1.0", default-features = false, optional = true, features = ["serde_derive"] }
slotmap = { version = "1.0.6", default-features = false, optional = true }
rustc-hash = { version = "2", default-features = false, optional = true }
smallvec = { version = "1.13", default-features = false, optional = true }
cssparser = { version = "0.38.0", default-features = false, optional = true }

[features]
default = [
    "std",
    "taffy_tree",
    "flexbox",
    "flexbox_balance",
    "grid",
    "block_layout",
    "float_layout",
    "calc",
    "content_size",
    "detailed_layout_info",
]
#! ## Feature Flags
#!
#! ### Algorithms

## Enables the Block layout algorithm. See [`compute_block_layout`](crate::compute_block_layout).
block_layout = []
## Enables the Float layout algorithm. This is a sub-feature of block layout.
float_layout = []
## Enables the Flexbox layout algorithm. See [`compute_flexbox_layout`](crate::compute_flexbox_layout).
flexbox = []
## Enables support for `flex-wrap: balance` and `flex-line-count` from [CSS Flexbox Level 2](https://drafts.csswg.org/css-flexbox-2/)
flexbox_balance = ["flexbox"]
## Enables the CSS Grid layout algorithm. See [`compute_grid_layout`](crate::compute_grid_layout).
grid = ["dep:smallvec"]
## Enables calc() values for all layout algorithms
calc = []
## Causes all algorithms to compute and output a content size for each node
content_size = []
## Causes algorithms to stores detailed information of the nodes in TaffyTree, with only CSS Grid supporting this.
detailed_layout_info = []
## Deprecated no-op: Taffy always uses strict provenance APIs for pointer manipulation. Retained so that existing `features = ["strict_provenance"]` configurations keep compiling.
strict_provenance = []

#! ### Taffy Tree

## Enable the built-in Taffy node tree. See [`TaffyTree`](crate::TaffyTree).
taffy_tree = ["dep:slotmap", "dep:rustc-hash"]

#! ### Other

## Add [`serde`] derives to Style structs
serde = ["dep:serde", "serde/alloc"]
## Implement `FromStr` trait for Taffy style types
parse = ["dep:cssparser"]
## Enable the `parse` feature with proc-macro dependent optimisations
parse_faster = ["parse", "cssparser/fast_match_byte"]
## Allow Taffy to depend on the [`Rust Standard Library`](std)
std = ["serde?/std", "slotmap?/std"]
## Deprecated no-op: Taffy always depends on the `alloc` library. Retained so that existing `features = ["alloc"]` configurations keep compiling.
alloc = []
## Internal feature for debugging
debug = ["std"]
## Internal feature for profiling
profile = ["std"]
